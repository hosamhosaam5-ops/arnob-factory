name: letter-card unit and syntax checks

on:
  push:
    branches: [feat/letter-card-silma-20261127]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: letter-card-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-syntax:
    if: ${{ github.ref == 'refs/heads/feat/letter-card-silma-20261127' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Syntax scan — Ruff and every Python source file
        shell: bash
        run: |
          set -uo pipefail
          python3 -m venv .venv-syntax
          .venv-syntax/bin/python -m pip install --disable-pip-version-check --no-input "ruff==0.14.10"
          .venv-syntax/bin/ruff --version
          set +e
          .venv-syntax/bin/ruff check --no-cache --output-format=concise . 2>&1 | tee ruff-scan.log
          ruff_status=\${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path("ruff-scan.log").read_text(encoding="utf-8", errors="replace").splitlines()
          pattern = re.compile(r"^(.+\.py):(\d+):(\d+):\s+(\S+)\s+(.*)$")
          for diagnostic in log:
              match = pattern.match(diagnostic)
              if not match:
                  continue
              file_name, line_text, col_text, code, message = match.groups()
              path = Path(file_name)
              try:
                  lines = path.read_text(encoding="utf-8").splitlines()
              except (OSError, UnicodeError):
                  continue
              line_no = int(line_text)
              print(f"SYNTAX_CONTEXT {file_name}:{line_no}:{col_text} {code} {message}")
              for number in range(max(1, line_no - 3), min(len(lines), line_no + 3) + 1):
                  value = lines[number - 1]
                  prefix = value[:len(value) - len(value.lstrip(" \t"))]
                  spaces = prefix.count(" ")
                  tabs = prefix.count("\t")
                  print(f"  {number:04d} indent_spaces={spaces} indent_tabs={tabs} | {value}")
          PY
          compile_status=0
          mapfile -d '' python_files < <(find . -type f -name '*.py' \
            -not -path './.git/*' -not -path './.venv*/*' -print0 | sort -z)
          for file in "\${python_files[@]}"; do
            echo "PY_COMPILE file=$file"
            if python3 -m py_compile "$file" 2>&1; then
              echo "PY_COMPILE_RESULT=PASS file=$file"
            else
              echo "PY_COMPILE_RESULT=FAIL file=$file"
              compile_status=1
            fi
          done
          echo "RUFF_EXIT_CODE=$ruff_status"
          echo "PY_COMPILE_EXIT_CODE=$compile_status"
          if [ "$ruff_status" -ne 0 ] || [ "$compile_status" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare Python and Arabic rendering test dependency
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input --only-binary=:all: Pillow

      - name: Python syntax and unit tests
        run: |
          .venv/bin/python -m compileall -q scripts tests
          .venv/bin/python -m unittest discover -s tests -v

      - name: Node syntax
        run: |
          node --check scripts/letter_card_qa.mjs
          node --check scripts/character_episode_qa.mjs
          node --check src/production/audio-mixer.js
          node --check src/production/video-qa.js

      - name: Bash syntax
        shell: bash
        run: |
          for file in scripts/*.sh; do
            [ -f "$file" ] || continue
            bash -n "$file"
          done

      - name: Workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/letter-card-checks.yml \
            .github/workflows/letter-card-pipeline.yml
