name: Temporary chunk-03 auto-seed verification

on:
  push:
    branches:
      - tmp/autoseed-chunk03-20261128

permissions:
  contents: read
  actions: read

concurrency:
  group: autoseed-chunk03-temporary
  cancel-in-progress: false

jobs:
  trial:
    if: ${{ github.ref == 'refs/heads/tmp/autoseed-chunk03-20261128' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      GEN_DIR: artifacts/autoseed-chunk03
    steps:
      - name: Checkout exact temporary branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python 3.12 (Pynini-compatible)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-silma.txt

      - name: Prepare persistent trial evidence folders
        run: |
          set -euo pipefail
          mkdir -p "$GEN_DIR/logs" "$GEN_DIR/references" "$GEN_DIR/chunks"
          echo "PYTHON_VERSION=$(python --version)"
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), sys.version
          print("PYTHON_312_GATE=PASS")
          PY

      - name: Install CPU-only SILMA dependencies
        run: |
          set -euo pipefail
          bash scripts/install_cpu_stack.sh 2>&1 | tee "$GEN_DIR/logs/install.log"
          python -m py_compile scripts/silma_episode.py scripts/evaluate_silma_seed.py
          echo "CPU_ONLY_SILMA_SETUP=PASS"

      - name: Verify approved episode text and pinned Pistachio PCM reference
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          episode=json.loads(Path("assets/episodes/letter-alif.json").read_text(encoding="utf-8"))
          matches=[item for item in episode["chunks"] if item["chunkId"]=="chunk-03"]
          assert len(matches)==1
          chunk=matches[0]
          assert chunk["speakerId"]=="pistachio"
          assert chunk["speakerArabic"]=="فستق"
          assert chunk["settings"]["voice"]=="ar+f3"
          print(json.dumps({
            "episodeId":episode["episodeId"],
            "chunkId":chunk["chunkId"],
            "speaker":chunk["speakerArabic"],
            "voice":chunk["settings"]["voice"],
            "text":chunk["text"]
          },ensure_ascii=False))
          PY
          bash scripts/prepare_silma_method_a.sh "$GEN_DIR/references" \
            2>&1 | tee "$GEN_DIR/logs/reference-preflight.log"
          python - <<'PY'
          import hashlib, json, wave
          from pathlib import Path
          root=Path("artifacts/autoseed-chunk03/references")
          approval=json.loads(Path("assets/references/pistachio-method-a-approval.json").read_text())
          path=root/"pistachio-reference.wav"
          with wave.open(str(path),"rb") as wav:
              assert (wav.getnchannels(),wav.getframerate(),wav.getsampwidth())==(1,24000,2)
              pcm=wav.readframes(wav.getnframes())
          actual=hashlib.sha256(pcm).hexdigest()
          expected="724b5f6020aef1f87d0942d15cb2f6aa78a70fbbfbf86d2800cd2b99972a49cb"
          assert actual==expected==approval["references"]["pistachio"]["pcmSha256"]
          print(f"PISTACHIO_PCM_SHA256={actual}")
          print("PISTACHIO_PCM_GATE=PASS")
          PY

      - name: Create one-shot authorized seed-trial request
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/autoseed-request.json" <<'JSON'
          {
            "schemaVersion": 1,
            "episodeId": "letter-alif",
            "purpose": "seed-trials",
            "chunkId": "chunk-03",
            "seeds": [4245, 4246, 4247, 4248, 4249]
          }
          JSON
          cat "$RUNNER_TEMP/autoseed-request.json"

      - name: Run one real SILMA chunk with five bounded seed candidates
        env:
          ARNOB_RUN_REQUEST_PATH: ${{ runner.temp }}/autoseed-request.json
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          timeout --signal=TERM --kill-after=30s 2400s \
            python scripts/silma_episode.py \
              --episode-manifest assets/episodes/letter-alif.json \
              --references-dir "$GEN_DIR/references" \
              --output-dir "$GEN_DIR" \
              --only-chunk-id chunk-03 \
              --auto-seed \
              2>&1 | tee "$GEN_DIR/logs/auto-seed.log"

      - name: Verify all five-seed decision metrics and both model digests
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f "$GEN_DIR/manifest.json" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("artifacts/autoseed-chunk03/manifest.json").read_text())
          print("GENERATION_STATUS="+str(m.get("status")))
          print("MODEL_INFERENCE_INVOKED="+str(m.get("modelInferenceInvoked")))
          for name,item in m.get("weights",{}).items():
              print(f"WEIGHT_{name.upper()}_SHA256={item.get('sha256')}")
              expected={
                "silma":"f43256d0b78b8803c638aed0875da5a4b372b4a784690a0156e5baff14f7336c",
                "vocos":"97ec976ad1fd67a33ab2682d29c0ac7df85234fae875aefcc5fb215681a91b2a",
              }[name]
              assert item.get("sha256")==expected, (name,item)
          trials=m.get("autoSeedTrials",{}).get("chunk-03",[])
          for trial in trials:
              print(json.dumps({
                "seed":trial.get("seed"),
                "longestInternalSilenceSeconds":trial.get("longestInternalSilenceSeconds"),
                "durationSeconds":trial.get("durationSeconds"),
                "peakAmplitude":trial.get("peakAmplitude"),
                "passesDuration":trial.get("passesDuration"),
                "passesInternalSilence":trial.get("passesInternalSilence"),
                "passesPeakAmplitude":trial.get("passesPeakAmplitude"),
                "pass":trial.get("pass")
              },ensure_ascii=False))
          print("TRIAL_COUNT="+str(len(trials)))
          if m.get("status")=="complete":
              assert m.get("selectedChunkId")=="chunk-03"
              assert len(trials)>=1
              selected=[x for x in m["completedChunks"] if x.get("chunkId")=="chunk-03"]
              assert len(selected)==1
              assert selected[0]["settings"]["seed"] in [4245,4246,4247,4248,4249]
              assert selected[0]["autoSeedTrials"]
              assert selected[0]["autoSeedTrials"][-1]["pass"] is True
              assert selected[0]["autoSeedTrials"][-1]["longestInternalSilenceSeconds"] < 0.45
              assert selected[0]["autoSeedTrials"][-1]["peakAmplitude"] < 0.95
              print("AUTO_SEED_SELECTED="+str(selected[0]["settings"]["seed"]))
              print("AUTO_SEED_LOGIC=PASS")
          PY
          fi

      - name: Upload every seed WAV, MP3, manifest, weights and measurements even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autoseed-chunk03-attempt-${{ github.run_attempt }}-${{ github.run_id }}
          path: |
            artifacts/autoseed-chunk03/**
            artifacts/silma-letter-card/**
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
