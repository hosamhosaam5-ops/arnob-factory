name: Unified episode generation (dispatch only)

on:
  workflow_dispatch:
    inputs:
      episode_name:
        description: Episode manifest name under assets/episodes without .json
        required: true
        type: string
        default: letter-alif
      dry_run:
        description: Run gates without SILMA inference or rendering
        required: true
        type: boolean
        default: true
      run_cap:
        description: Maximum number of manual dispatch runs on main for this workflow
        required: true
        type: number
        default: 2

permissions:
  actions: read
  contents: read

concurrency:
  group: unified-episode-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  unified:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with two commits of history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate request, episode source and explicit run cap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EPISODE_NAME: ${{ inputs.episode_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_CAP: ${{ inputs.run_cap }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$EPISODE_NAME" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
          [[ "$RUN_CAP" =~ ^[0-9]+$ ]]
          test "$RUN_CAP" -ge 1
          test "$RUN_CAP" -le 20
          python - "$EPISODE_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          name=sys.argv[1]
          data=json.loads((Path("assets/episodes")/(name+".json")).read_text(encoding="utf-8"))
          chunks=data.get("chunks")
          assert data.get("schemaVersion")==1 and data.get("status")=="approved-script"
          assert data.get("episodeId")==name
          assert isinstance(chunks,list) and 1 <= len(chunks) <= 16
          assert all(isinstance(c.get("text"),str) and c["text"].strip() for c in chunks)
          assert all(c.get("speakerId") in {"pistachio","hazelnut"} for c in chunks)
          print(f"EPISODE_SOURCE_GATE=PASS name={name} chunks={len(chunks)}")
          PY
          runs="$(gh api "repos/$REPOSITORY/actions/workflows/unified-episode-pipeline.yml/runs?per_page=100")"
          count="$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.event=="workflow_dispatch" and .head_branch=="main" and .run_attempt==1)] | length')"
          echo "UNIFIED_PIPELINE_PRIOR_DISPATCH_RUNS=$count"
          echo "UNIFIED_PIPELINE_RUN_CAP=$RUN_CAP"
          test "$count" -lt "$RUN_CAP"
          echo "REQUEST_AND_RUN_CAP_GATES=PASS"
          echo "DRY_RUN=$DRY_RUN"

      - name: Download fixed calibration evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 15253057317
          run-id: 46119257810
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: calibration

      - name: Download approved production source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 15257366397
          run-id: 46130035251
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: run8

      - name: Install FFmpeg, Ruff and run static tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input "ruff==0.14.10"
          ruff check .
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          node --check scripts/letter_card_qa.mjs
          node --check src/production/audio-mixer.js
          node --check src/production/video-qa.js
          for file in scripts/*.sh; do [ -f "$file" ] || continue; bash -n "$file"; done
          echo "STATIC_TESTS_AND_SYNTAX=PASS"

      - name: Verify artifact digests, contents and committed PCM references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p preflight-evidence
          calibration_digest="$(gh api "repos/$REPOSITORY/actions/artifacts/15253057317" --jq '.digest')"
          source_digest="$(gh api "repos/$REPOSITORY/actions/artifacts/15257366397" --jq '.digest')"
          test "$calibration_digest" = "sha256:9f611770a90f2d5fffc99fafae2f8d74e9a5802e61037fd6971fc4f141930270"
          test "$source_digest" = "sha256:fd9f5ea62e2413dc5b1fdfb9a76c86cd15a965d707fdef69593c3f9c93336c6b"
          CAL="$GITHUB_WORKSPACE/calibration/silma-chunk-03-calibration-seed-trials-46119257810/artifacts/seed-trials/selected-candidate"
          RUN8="$GITHUB_WORKSPACE/run8/letter-card-alif-007-46130035251"
          test -s "$CAL/manifest.json"
          test -s "$RUN8/build/letter-card/letter-card-episode.mp4"
          test -s "$RUN8/build/letter-card/video-qa-report.json"
          test -s "$RUN8/artifacts/silma-letter-card/manifest.json"
          bash scripts/prepare_silma_method_a.sh "$RUNNER_TEMP/approved-references" | tee preflight-evidence/reference-preflight.log
          python scripts/evaluate_silma_seed.py \
            --mp3 "$CAL/chunks/03-pistachio.mp3" \
            --wav "$CAL/chunks/03-pistachio.wav" \
            --manifest "$CAL/manifest.json" \
            --chunk-id chunk-03 --expected-duration 2.54 \
            --duration-tolerance 0.30 --maximum-internal-silence 0.45 \
            > preflight-evidence/ready-clip-silence-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("preflight-evidence/ready-clip-silence-check.json").read_text())
          assert r["pass"] is True, r
          print(json.dumps({k:r[k] for k in (
            "chunkId","seed","durationSeconds","longestInternalSilenceSeconds",
            "peakAmplitude","passesDuration","passesInternalSilence","passesPeakAmplitude"
          )},indent=2))
          PY
          echo "ARTIFACT_AND_READY_AUDIO_GATES=PASS"

      - name: Execute mandatory synthetic dry run (never calls SILMA or renderer)
        if: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          bash scripts/prepare_silma_method_a.sh artifacts/silma-letter-card/references
          python scripts/silma_episode.py \
            --episode-manifest "assets/episodes/${{ inputs.episode_name }}.json" \
            --output-dir "$RUNNER_TEMP/unified-dry-run" \
            --references-dir artifacts/silma-letter-card/references \
            --dry-run \
            2>&1 | tee preflight-evidence/dry-run.log
          jq -e '.status=="complete" and .dryRun==true and .modelInferenceInvoked==false and .weights.silma.status=="not_downloaded"' \
            "$RUNNER_TEMP/unified-dry-run/manifest.json" >/dev/null
          echo "DRY_RUN_NO_INFERENCE_NO_RENDER=PASS"

      - name: Install CPU-only SILMA stack
        if: ${{ inputs.dry_run == false }}
        run: bash scripts/install_cpu_stack.sh 2>&1 | tee artifacts/silma-letter-card/logs/install.log

      - name: Prepare pinned PCM references for the inference run
        if: ${{ inputs.dry_run == false }}
        run: bash scripts/prepare_silma_method_a.sh artifacts/silma-letter-card/references 2>&1 | tee artifacts/silma-letter-card/logs/references.log

      - name: Generate episode using bounded automatic seed selection
        if: ${{ inputs.dry_run == false }}
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "600"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 2400s \
            python scripts/silma_episode.py \
              --episode-manifest "assets/episodes/${{ inputs.episode_name }}.json" \
              --references-dir artifacts/silma-letter-card/references \
              --output-dir artifacts/silma-letter-card \
              --auto-seed \
              2>&1 | tee artifacts/silma-letter-card/logs/generation.log

      - name: Validate completed source audio and model weights
        if: ${{ inputs.dry_run == false && success() }}
        run: python scripts/validate_silma_episode.py artifacts/silma-letter-card "assets/episodes/${{ inputs.episode_name }}.json" 2>&1 | tee artifacts/silma-letter-card/logs/validation.log

      - name: Render with edge-only silence removal
        if: ${{ inputs.dry_run == false && success() }}
        run: python scripts/render_character_episode.py --input-dir artifacts/silma-letter-card --output-dir build/episode 2>&1 | tee artifacts/silma-letter-card/logs/render.log

      - name: Assert immutable QA thresholds
        if: ${{ inputs.dry_run == false && success() }}
        run: |
          node --input-type=module --eval '
          import { DEFAULT_LIMITS } from "./src/production/video-qa.js";
          if (DEFAULT_LIMITS.maxSilenceSegmentSeconds !== 0.5) throw new Error("silence threshold changed");
          if (DEFAULT_LIMITS.maxAvDurationDifferenceSeconds !== 0.15) throw new Error("A/V duration threshold changed");
          if (DEFAULT_LIMITS.silenceNoise !== "-50dB") throw new Error("silence detector noise threshold changed");
          console.log("QA_LIMITS_UNCHANGED=PASS", DEFAULT_LIMITS);
          '

      - name: Run Audio Mix QA
        if: ${{ inputs.dry_run == false && success() }}
        run: node scripts/letter_card_qa.mjs artifacts/silma-letter-card build/episode audio-mix

      - name: Run Video QA
        if: ${{ inputs.dry_run == false && success() }}
        run: node scripts/letter_card_qa.mjs artifacts/silma-letter-card build/episode video-qa

      - name: Upload logs, audio checkpoints, renders and QA results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unified-episode-${{ inputs.episode_name }}-${{ github.run_id }}
          path: |
            preflight-evidence/**
            artifacts/silma-letter-card/**
            build/episode/**
            ${{ runner.temp }}/unified-dry-run/**
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
