name: Owner-authorized Alif #8 reusable runner

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Run pre-generation gates and replacement checks without rendering or production work."
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  pipeline:
    if: ${{ inputs.dry_run == true || (github.event_name == 'push' && github.ref == 'refs/heads/feat/letter-card-silma-20261127' && github.run_attempt == 1 && github.run_number == 8) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout with parent commit available
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate owner request, expected parent, and one-shot run cap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("run-requests/alif-007.json").read_text(encoding="utf-8"))
          assert r["episodeId"] == "letter-alif"
          assert r["confirm_new_episode_run"] is True
          assert r["runNumber"] == 8
          assert r["expectedBranch"] == "feat/letter-card-silma-20261127"
          assert r["expectedParent"] == "796feb6dac66f416f79de679bb623e0e1b877f4e"
          assert r["run6ArtifactId"] == 46068424765
          assert r["calibrationRunId"] == 46119257810
          assert r["calibrationArtifactId"] == 15253057317
          assert r["seed"] == 4250
          assert r["candidateSha256"]["wav"] == "3649358adab289d936bfe09551624f646bc5b35b1f43eef0b44739da802ae3da"
          assert r["candidateSha256"]["mp3"] == "3a9459f3115007cdd0e6871b72367c45bb589e654ce293ae3d886bd2756502f8"
          assert r["referenceApprovalManifest"] == "assets/references/pistachio-method-a-approval.json"
          assert r["dryRun"] is (Path(".github/workflows/alif-007-preflight-dry-run.yml").exists())
          print("OWNER_REQUEST_GATE=PASS")
          PY
          if [ "$DRY_RUN" = "true" ]; then
            test "$BRANCH" = "verify/alif-007-dryrun-20261128"
          else
            test "$BRANCH" = "feat/letter-card-silma-20261127"
            test "$RUN_NUMBER" = "8"
            test "$RUN_ID" -gt 0
          fi
          expected_parent="$(python -c 'import json; print(json.load(open("run-requests/alif-007.json"))["expectedParent"])')"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          echo "HEAD_PARENT_GATE=PASS"
          runs="$(gh api "repos/$REPOSITORY/actions/workflows/letter-card-pipeline.yml/runs?per_page=100")"
          printf '%s' "$runs" | jq -e --arg branch "feat/letter-card-silma-20261127" --arg run "$RUN_NUMBER" --arg id "$RUN_ID" --arg sha "$EXPECTED_SHA" --arg dry "$DRY_RUN" '
            [.workflow_runs[] | select(.head_branch==$branch and .run_attempt==1)] as $all
            | if $dry == "true" then
                ([$all[] | select(.run_number<=7)] | length)==7
                and ([$all[] | select(.run_number==8)] | length)==0
              else
                ([$all[] | select(.run_number==8 and .id==($id|tonumber) and .head_sha==$sha and .event=="push")] | length)==1
                and ([$all[] | select(.run_number<8)] | length)==7
                and ([$all[] | select(.run_number>8)] | length)==0
              end
          ' >/dev/null
          echo "RUN_COUNT_7_TO_8_GUARD=PASS"

      - name: Check required episode and replacement source files
        run: |
          set -euo pipefail
          test -s assets/episodes/letter-alif.json
          test -s assets/references/pistachio-method-a-approval.json
          test -s scripts/replace_silma_chunk.py
          test -s scripts/render_letter_card.py
          test -s scripts/render_character_episode.py
          test -s scripts/letter_card_qa.mjs
          test -s src/production/audio-mixer.js
          test -s src/production/video-qa.js
          test -d tests
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("assets/episodes/letter-alif.json").read_text(encoding="utf-8"))
          assert s.get("schemaVersion")==1 and s.get("status")=="approved-script"
          assert s.get("episodeId")=="letter-alif" and len(s.get("chunks",[]))==8
          a=json.loads(Path("assets/references/pistachio-method-a-approval.json").read_text(encoding="utf-8"))
          assert a.get("approvalId")=="pistachio-ar-f3-method-a-v2"
          assert a.get("sha256")=="f5318de003d2a9d41852478cddcf9439be976132f1d420aab72a10c78c97389f"
          print("SOURCE_FILES_GATE=PASS")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install local test and silence-check tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: Pillow
          ffmpeg -version | head -n 1

      - name: Run exactly 28 unit tests and all syntax checks
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python - <<'PY'
          import unittest
          suite=unittest.defaultTestLoader.discover("tests")
          count=suite.countTestCases()
          assert count==28, f"Expected 28 tests, found {count}"
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun==28 and result.wasSuccessful(), "Unit tests did not all pass"
          print("UNIT_TESTS=28/28 PASS")
          PY
          python -m py_compile scripts/render_letter_card.py scripts/replace_silma_chunk.py
          node --check scripts/letter_card_qa.mjs
          node --check src/production/audio-mixer.js
          node --check src/production/video-qa.js
          for file in scripts/*.sh; do [ -f "$file" ] || continue; bash -n "$file"; done
          echo "SOURCE_SYNTAX_CHECKS=PASS"

      - name: Download exact Run 6 and calibration artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/run6 /tmp/calibration
          gh run download 46068424765 --repo "$REPOSITORY" --name letter-card-alif-46068424765 --dir /tmp/run6
          gh run download 46119257810 --repo "$REPOSITORY" --name silma-chunk-03-calibration-seed-trials-46119257810 --dir /tmp/calibration
          test -s /tmp/run6/artifacts/silma-letter-card/manifest.json
          test -s /tmp/calibration/artifacts/seed-trials/selected-candidate/manifest.json
          echo "RUN6_AND_CALIBRATION_ARTIFACTS=PASS"

      - name: Verify approved seed 4250 hashes and all 14 preserved media files
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path("/tmp/run6/artifacts/silma-letter-card")
          candidate=Path("/tmp/calibration/artifacts/seed-trials/selected-candidate")
          expected={"wav":"3649358adab289d936bfe09551624f646bc5b35b1f43eef0b44739da802ae3da",
                    "mp3":"3a9459f3115007cdd0e6871b72367c45bb589e654ce293ae3d886bd2756502f8"}
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((base/"manifest.json").read_text())
          c=json.loads((candidate/"manifest.json").read_text())
          item=c["completedChunks"][0]
          assert item["chunkId"]=="chunk-03" and item["settings"]["seed"]==4250
          for key in ("wav","mp3"):
              assert sha(candidate/item[key]["path"])==expected[key]
          before={}
          for row in m["completedChunks"]:
              if row["chunkId"]=="chunk-03": continue
              for key in ("wav","mp3"):
                  p=base/row[key]["path"]
                  assert sha(p)==row[key]["sha256"]
                  before[f'{row["chunkId"]}:{key}']=sha(p)
          assert len(before)==14
          Path("artifacts/preflight").mkdir(parents=True,exist_ok=True)
          Path("artifacts/preflight/baseline-preserved-media.json").write_text(json.dumps(before,indent=2)+"\n")
          Path("artifacts/preflight/candidate-hash-check.json").write_text(json.dumps({"status":"pass","seed":4250,"candidate":expected},indent=2)+"\n")
          print(json.dumps({"candidateHashVerification":"PASS","seed":4250,"preservedMediaCount":14},indent=2))
          PY

      - name: Apply official replacement helper to isolated Run 6 copy
        run: |
          set -euo pipefail
          mkdir -p artifacts/silma-letter-card
          cp -a /tmp/run6/artifacts/silma-letter-card/. artifacts/silma-letter-card/
          python scripts/replace_silma_chunk.py \
            --base-dir artifacts/silma-letter-card \
            --candidate-dir /tmp/calibration/artifacts/seed-trials/selected-candidate \
            --chunk-id chunk-03 \
            --reference-approval-manifest assets/references/pistachio-method-a-approval.json \
            | tee artifacts/preflight/replacement-result.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("artifacts/silma-letter-card")
          result=json.loads(Path("artifacts/preflight/replacement-result.json").read_text())
          m=json.loads((root/"manifest.json").read_text())
          baseline=json.loads(Path("artifacts/preflight/baseline-preserved-media.json").read_text())
          assert result["status"]=="replaced" and result["seed"]==4250
          assert result["preservedChunkCount"]==7 and result["preservedMediaCount"]==14
          assert len(m["completedChunks"])==8
          assert m["replacementHistory"][-1]["chunkId"]=="chunk-03"
          assert m["replacementHistory"][-1]["seed"]==4250
          assert (root/"measurement-table.csv").is_file()
          after={}
          for row in m["completedChunks"]:
              if row["chunkId"]=="chunk-03": continue
              for key in ("wav","mp3"):
                  after[f'{row["chunkId"]}:{key}']=hashlib.sha256((root/row[key]["path"]).read_bytes()).hexdigest()
          assert after==baseline and result["preservedMediaSha256"]==baseline
          assert m["episode"]["wav"]["sha256"] and m["episode"]["mp3"]["sha256"]
          print(json.dumps({"replacement":"PASS","preservedMediaFiles":14,"manifestHistoryAndMeasurements":"PASS",
            "episodeWavSha256":m["episode"]["wav"]["sha256"],"episodeMp3Sha256":m["episode"]["mp3"]["sha256"]},indent=2))
          PY

      - name: Run strict -50dB silence checks on every MP3/WAV before and after edge-only trim
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          root=Path("artifacts/silma-letter-card")
          m=json.loads((root/"manifest.json").read_text())
          out=Path("artifacts/preflight"); out.mkdir(parents=True,exist_ok=True)
          trimmed=out/"edge-trimmed"; trimmed.mkdir(parents=True,exist_ok=True)
          edge_filter=("silenceremove=start_periods=1:start_duration=0.02:start_threshold=-50dB:"
            "start_silence=0.10:window=0.02,areverse,"
            "silenceremove=start_periods=1:start_duration=0.02:start_threshold=-50dB:"
            "start_silence=0.10:window=0.02,areverse")
          def detect(path):
              p=subprocess.run(["ffmpeg","-hide_banner","-nostdin","-i",str(path),
                "-af","silencedetect=noise=-50dB:d=0.02","-f","null","-"],
                text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode:
                  raise RuntimeError(f"silencedetect failed for {path}: {p.stderr[-2000:]}")
              vals=[float(x) for x in re.findall(r"silence_duration:\s*([0-9.]+)",p.stderr)]
              return max(vals,default=0.0)
          rows=[]
          for item in m["completedChunks"]:
              for media in ("wav","mp3"):
                  src=root/item[media]["path"]
                  srcmax=detect(src)
                  dst=trimmed/(Path(src).stem+".trimmed."+media)
                  args=["ffmpeg","-hide_banner","-nostdin","-loglevel","error","-y","-i",str(src),
                    "-af",edge_filter,"-ar","24000","-ac","1"]
                  args += (["-c:a","pcm_s16le"] if media=="wav" else ["-codec:a","libmp3lame","-b:a","128k"])
                  args += [str(dst)]
                  p=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if p.returncode:
                      raise RuntimeError(f"edge-only silence trim failed for {src}: {p.stderr[-2000:]}")
                  trimmax=detect(dst)
                  rows.append({"chunkId":item["chunkId"],"media":media,
                    "sourceLongestSilenceSeconds":round(srcmax,6),
                    "edgeTrimmedLongestSilenceSeconds":round(trimmax,6),
                    "sourcePass":srcmax<0.5,"edgeTrimmedPass":trimmax<0.5,
                    "sourceSha256":item[media]["sha256"]})
          failures=[r for r in rows if not r["sourcePass"] or not r["edgeTrimmedPass"]]
          report={"thresholdSeconds":0.5,"noiseThreshold":"-50dB","minimumSilenceDurationSeconds":0.02,
            "filesChecked":len(rows),"measurements":len(rows)*2,"rows":rows,
            "status":"fail" if failures else "pass","failures":failures,
            "internalSilenceTrimmed":False}
          (out/"silencedetect-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          if failures: raise SystemExit(1)
          timeline=[]; cursor=0.0
          for index,item in enumerate(m["completedChunks"]):
              p=trimmed/(Path(item["wav"]["path"]).stem+".trimmed.wav")
              duration=float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration",
                "-of","default=noprint_wrappers=1:nokey=1",str(p)],text=True).strip())
              timeline.append({"chunkId":item["chunkId"],"startSeconds":round(cursor,6),"durationSeconds":round(duration,6)})
              cursor += duration + (0.20 if index < len(m["completedChunks"])-1 else 0.0)
          total=round(cursor,6)
          (out/"trimmed-render-timeline.json").write_text(json.dumps({
            "source":"edge-trimmed WAV durations measured by ffprobe after chunk-03 replacement",
            "interChunkPauseSeconds":0.20,"durationSeconds":total,"segments":timeline},indent=2)+"\n")
          assert abs(total-22.264250)<=0.02, f"Unexpected post-replacement timeline duration: {total}"
          print(json.dumps({"POST_REPLACEMENT_TIMELINE_SECONDS":total,"expectedSeconds":22.264250,
            "timelineGate":"PASS","silenceGate":"PASS"},indent=2))
          PY

      - name: Report dry-run completed without invoking render or SILMA
        if: ${{ inputs.dry_run == true && success() }}
        run: |
          echo "DRY_RUN=PASS"
          echo "PRODUCTION_RENDER=NOT_EXECUTED"
          echo "SILMA_INFERENCE=NOT_EXECUTED"

      - name: Install CPU rendering tools
        if: ${{ inputs.dry_run == false && success() }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg librsvg2-bin fonts-noto-core python3-pil libraqm0
          python -c "from PIL import features; assert features.check('raqm'), 'Arabic RAQM is required'"
          rsvg-convert --version

      - name: Render the episode from Run 6 with only chunk 03 replaced
        if: ${{ inputs.dry_run == false && success() }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/render_letter_card.py
          python scripts/render_letter_card.py \
            --generation-dir artifacts/silma-letter-card \
            --output-dir build/letter-card \
            2>&1 | tee artifacts/silma-letter-card/logs/render-replacement.log
          test -s build/letter-card/letter-card-video-raw.mp4
          test -s build/letter-card/render-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          timeline=json.loads(Path("artifacts/preflight/trimmed-render-timeline.json").read_text())
          render=json.loads(Path("build/letter-card/render-report.json").read_text())
          delta=abs(float(render["durationSeconds"])-float(timeline["durationSeconds"]))
          assert delta <= (1/24)+0.001, f"Rendered duration diverges from post-replacement timeline by {delta:.6f}s"
          print(json.dumps({"timelineSeconds":timeline["durationSeconds"],"renderedVideoSeconds":render["durationSeconds"],
            "fps":render["fps"],"frames":render["frames"],"durationDeltaSeconds":round(delta,6),
            "renderWallSeconds":render["renderWallSeconds"]},indent=2))
          PY

      - name: Record SHA-256 for every rendered frame and preview image
        if: ${{ inputs.dry_run == false && success() }}
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("build/letter-card")
          frames=sorted((root/"frames").glob("*.png"))
          preview=sorted((root/"preview").glob("*.png"))
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          report={"frameCount":len(frames),"frames":[{"path":p.relative_to(root).as_posix(),"sha256":sha(p),"sizeBytes":p.stat().st_size} for p in frames],
            "previewFrames":[{"path":p.relative_to(root).as_posix(),"sha256":sha(p),"sizeBytes":p.stat().st_size} for p in preview]}
          assert len(frames)>0 and len(preview)==3
          (root/"frame-hashes.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({"frameCount":len(frames),"previewFrameCount":len(preview),
            "frameHashesFileSha256":sha(root/"frame-hashes.json"),
            "previewFrames":report["previewFrames"]},indent=2))
          PY

      - name: Run Audio Mix QA
        id: audio_mix
        if: ${{ inputs.dry_run == false && success() }}
        run: node scripts/letter_card_qa.mjs artifacts/silma-letter-card build/letter-card audio-mix

      - name: Print every Audio Mix QA measurement and limit on failure
        if: ${{ always() && inputs.dry_run == false && steps.audio_mix.outcome == 'failure' }}
        run: |
          python - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          d=Path("build/letter-card")
          video=d/"letter-card-video-raw.mp4"
          mixed=d/"episode-audio-mix.wav"
          def probe(p):
              return json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries",
                "stream=codec_name,codec_type,sample_rate,channels,duration:format=duration","-of","json",str(p)],text=True))
          video_duration=mixed_duration=max_silence=None
          codec=sample_rate=channels=None
          errors=[]
          try:
              if video.exists():
                  vp=probe(video); vs=next(s for s in vp["streams"] if s["codec_type"]=="video")
                  video_duration=float(vs.get("duration") or vp["format"]["duration"])
              else: errors.append("raw video missing")
              if mixed.exists():
                  ap=probe(mixed); a=next(s for s in ap["streams"] if s["codec_type"]=="audio")
                  codec=a.get("codec_name"); sample_rate=int(a.get("sample_rate",0)); channels=a.get("channels")
                  mixed_duration=float(a.get("duration") or ap["format"]["duration"])
                  p=subprocess.run(["ffmpeg","-hide_banner","-nostdin","-i",str(mixed),"-map","0:a:0",
                    "-af","silencedetect=noise=-50dB:d=0.02","-vn","-f","null","-"],
                    text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  vals=[float(x) for x in re.findall(r"silence_duration:\s*([0-9.]+)",p.stderr)]
                  max_silence=max(vals or [0.0])
                  if p.returncode: errors.append("silencedetect returned "+str(p.returncode))
              else: errors.append("mixed WAV missing")
          except Exception as exc:
              errors.append(str(exc))
          checks=[
            {"name":"wav_codec","value":codec,"limit":"pcm_s16le","status":"pass" if codec=="pcm_s16le" else "fail"},
            {"name":"sample_rate","value":sample_rate,"limit":48000,"unit":"Hz","status":"pass" if sample_rate==48000 else "fail"},
            {"name":"channels","value":channels,"limit":2,"status":"pass" if channels==2 else "fail"},
            {"name":"duration_matches_video","value":None if video_duration is None or mixed_duration is None else round(abs(video_duration-mixed_duration),6),
              "limit":0.08,"unit":"seconds","status":"pass" if video_duration is not None and mixed_duration is not None and abs(video_duration-mixed_duration)<=0.08 else "fail"},
            {"name":"continuous_audio","value":max_silence,"limit":0.5,"unit":"seconds","noiseThreshold":"-50dB",
              "minimumSilenceDurationSeconds":0.02,"status":"pass" if max_silence is not None and max_silence<=0.5 else "fail"}
          ]
          report={"status":"diagnostic-after-Audio-Mix-QA-failure","checks":checks,
            "rawVideoDurationSeconds":video_duration,"mixedAudioDurationSeconds":mixed_duration,
            "errors":errors,"limitsUnchanged":True}
          d.mkdir(parents=True,exist_ok=True)
          (d/"audio-mix-failure-diagnostics.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Run Video QA with unchanged limits
        if: ${{ inputs.dry_run == false && success() }}
        run: |
          node scripts/letter_card_qa.mjs artifacts/silma-letter-card build/letter-card video-qa
          jq -e '.status == "pass" and .protectedSilenceLimitSeconds == 0.5 and .sourceMediaUnmodified == true' \
            build/letter-card/audio-video-qa-report.json >/dev/null

      - name: Upload dry-run evidence and all production media even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: letter-card-alif-007-${{ github.run_id }}
          path: |
            artifacts/preflight/**
            artifacts/silma-letter-card/chunks/*.mp3
            artifacts/silma-letter-card/chunks/*.wav
            artifacts/silma-letter-card/manifest.json
            artifacts/silma-letter-card/measurement-table.csv
            artifacts/silma-letter-card/weight-preflight.json
            artifacts/silma-letter-card/references/reference-manifest.json
            artifacts/silma-letter-card/logs/*.log
            build/letter-card/letter-card-episode.mp4
            build/letter-card/letter-card-video-raw.mp4
            build/letter-card/episode-audio.wav
            build/letter-card/episode-audio-mix.wav
            build/letter-card/render-report.json
            build/letter-card/audio-mix-qa-report.json
            build/letter-card/video-qa-report.json
            build/letter-card/audio-video-qa-report.json
            build/letter-card/audio-mix-failure-diagnostics.json
            build/letter-card/frame-hashes.json
            build/letter-card/preview/*.png
            build/letter-card/frames/*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
