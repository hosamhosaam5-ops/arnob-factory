name: letter-card SILMA and render pipeline
on:
  push:
    branches:
      - feat/letter-card-silma-20261127
permissions:
  actions: read
  contents: read
concurrency:
  group: letter-card-pipeline-${{ github.repository }}
  cancel-in-progress: false
jobs:
  pipeline:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/letter-card-silma-20261127' && github.run_attempt == 1 && github.run_number == 8 }}
    uses: ./.github/workflows/_alif-007-runner.yml
    with:
      dry_run: false
