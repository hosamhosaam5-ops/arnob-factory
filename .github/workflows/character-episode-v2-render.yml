name: character episode v2 CPU render

on:
  push:
    branches:
      - feat/characters-v1-20261127
    paths:
      - '.ops/triggers/character-episode-v2-render.enable'
      - '.github/workflows/character-episode-v2-render.yml'
      - '.github/workflows/character-unit-checks.yml'
      - 'assets/audio/**'
      - 'assets/characters/**'
      - 'scripts/render_character_episode.py'
      - 'scripts/character_episode_qa.mjs'
      - 'src/production/audio-mixer.js'
      - 'src/production/video-qa.js'
      - 'tests/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: character-episode-v2-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-checks:
    uses: ./.github/workflows/character-unit-checks.yml

  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify activation marker and current open PR #1 head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker_json="$(gh api "repos/${GH_REPO}/contents/.ops/triggers/character-episode-v2-render.enable?ref=${EXPECTED_SHA}")"
          marker_content="$(printf '%s' "$marker_json" | jq -r '.content' | tr -d '\n' | base64 --decode)"
          test "$marker_content" = "activate-v2-render-after-green-unit-checks=true"
          pull_requests="$(gh api "repos/${GH_REPO}/pulls?state=open&head=${GH_OWNER}:feat/characters-v1-20261127")"
          printf '%s' "$pull_requests" | jq -e --arg sha "$EXPECTED_SHA" \
            'any(.[]; .number == 1 and .draft == true and .head.sha == $sha)' >/dev/null
          echo "Activation marker verified; PR #1 is open and its head matches $EXPECTED_SHA."

  render:
    needs: [unit-checks, pr-gate]
    if: >-
      needs.unit-checks.result == 'success' &&
      needs.pr-gate.result == 'success' &&
      github.ref == 'refs/heads/feat/characters-v1-20261127' &&
      github.run_attempt == 1 &&
      github.run_number <= 2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install CPU rendering and Arabic text dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg librsvg2-bin fonts-noto-core python3-pil libraqm0
          python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow RAQM is required'"
          ffmpeg -version | head -n 1
          rsvg-convert --version

      - name: Verify exactly the approved audio inputs
        run: |
          test -f assets/audio/manifest.json
          test "$(find assets/audio/chunks -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 8
          test "$(find assets/audio/chunks -maxdepth 1 -type f | wc -l)" -eq 8
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          root = Path('assets/audio')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['episodeId'] == 'episode-pilot-1'
          assert manifest['status'] == 'complete' and manifest['dryRun'] is False
          assert len(manifest['completedChunks']) == 8
          for item in manifest['completedChunks']:
              p = root / item['wav']['path']
              assert p.is_file() and p.stat().st_size == item['wav']['sizeBytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == item['wav']['sha256']
          PY

      - name: Render 24 fps 1280x720 episode on CPU
        id: render
        run: |
          python3 -m py_compile scripts/render_character_episode.py
          python3 scripts/render_character_episode.py \
            --input-dir assets/audio \
            --output-dir build/characters-v2
          test -s build/characters-v2/character-episode-v2.mp4
          test -s build/characters-v2/preview-scenes/scene-01.png
          test -s build/characters-v2/preview-scenes/scene-03.png
          test -s build/characters-v2/preview-scenes/scene-08.png
          test -s build/characters-v2/before-after-comparison.png
          test -s build/characters-v2/render-report.json
          test -s build/characters-v2/frame-times.csv

      - name: Run current Audio Mix QA and Video QA
        id: qa
        run: node scripts/character_episode_qa.mjs build/characters-v2

      - name: Split QA reports
        if: always() && steps.render.outcome == 'success' && steps.qa.outcome != 'skipped'
        run: |
          jq '.audioMix' build/characters-v2/audio-video-qa-report.json \
            > build/characters-v2/audio-mix-qa-report.json
          jq '.videoQa' build/characters-v2/audio-video-qa-report.json \
            > build/characters-v2/video-qa-report.json

      - name: Upload v2 video
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-episode-v2-video-${{ github.run_id }}
          path: build/characters-v2/character-episode-v2.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload scene 01 frame
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-episode-v2-scene-01-${{ github.run_id }}
          path: build/characters-v2/preview-scenes/scene-01.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload scene 03 digging and seed frame
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-episode-v2-scene-03-${{ github.run_id }}
          path: build/characters-v2/preview-scenes/scene-03.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload scene 08 final frame
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-episode-v2-scene-08-${{ github.run_id }}
          path: build/characters-v2/preview-scenes/scene-08.png
          if-no-files-found: error
          retention-days: 7

      - name: Upload before-after comparison page
        if: always() && steps.render.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-episode-v2-before-after-${{ github.run_id }}
          path: |
            build/characters-v2/before-after-comparison.png
            build/characters-v2/before-after-comparison.svg
          if-no-files-found: error
          retention-days: 7

      - name: Upload QA and render timing reports
        if: always() && steps.render.outcome == 'success' && steps.qa.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: character-episode-v2-reports-${{ github.run_id }}
          path: |
            build/characters-v2/audio-video-qa-report.json
            build/characters-v2/audio-mix-qa-report.json
            build/characters-v2/video-qa-report.json
            build/characters-v2/render-report.json
            build/characters-v2/frame-times.csv
          if-no-files-found: error
          retention-days: 7
